<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leave Request Form</title>
  <style>
    :root{ --bg:#f4f6f8; --card:#ffffff; --primary:#2563eb; --muted:#6b7280 }
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:var(--bg); margin:0; padding:24px}
    .container{max-width:720px;margin:40px auto;background:var(--card);border-radius:10px;box-shadow:0 6px 18px rgba(16,24,40,0.06);padding:28px}
    h1{margin:0 0 18px 0;color:#111827;font-size:1.5rem;text-align:center}
    form{display:block}
    .form-row{display:flex;gap:12px}
    .form-group{display:flex;flex-direction:column;margin-bottom:12px;flex:1}
    label{font-size:0.9rem;color:var(--muted);margin-bottom:6px}
    input[type="text"], input[type="date"], select, textarea{
      padding:10px 12px;border:1px solid #e6e9ee;border-radius:6px;font-size:1rem;color:#111827;background:#fff}
    textarea{min-height:100px;resize:vertical}
    .actions{display:flex;justify-content:flex-end;margin-top:14px}
    .btn{background:var(--primary);color:#fff;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
    .btn:active{transform:translateY(1px)}
    @media (max-width:640px){.form-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="container">
    <h1>Leave Request Form</h1>
    <form action="#" method="post">
      <div class="form-row">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Jane Doe" required />
        </div>
        <div class="form-group">
          <label for="employeeId">Employee ID</label>
          <input id="employeeId" name="employeeId" type="text" placeholder="E12345" required />
        </div>
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <input id="department" name="department" type="text" placeholder="Engineering" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="leaveType">Leave type</label>
          <select id="leaveType" name="leaveType">
            <option>Annual Leave</option>
            <option>Sick Leave</option>
            <option>Unpaid Leave</option>
            <option>Work from Home</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="startDate">Start date</label>
          <input id="startDate" name="startDate" type="date" required />
        </div>

        <div class="form-group">
          <label for="endDate">End date</label>
          <input id="endDate" name="endDate" type="date" required />
        </div>
      </div>

      <div class="form-group">
        <label for="reason">Reason / Notes</label>
        <textarea id="reason" name="reason" placeholder="Provide a short reason for the leave (optional)"></textarea>
      </div>

      <div class="actions">
        <button class="btn" type="submit">Submit Request</button>
      </div>
    </form>
  </div>
</body>
</html>
